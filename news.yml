name: Press feed

# Twice a day is enough. Google News takes hours to index Vietnamese outlets,
# so a shorter interval costs Action minutes and finds nothing new.
on:
  schedule:
    - cron: '0 1,9 * * *'      # 08:00 and 16:00 Ho Chi Minh City time
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install parser
        run: npm install fast-xml-parser --no-save

      - name: Collect candidates
        run: node scripts/collect-news.mjs

      # A pull request rather than a direct commit. Nothing reaches the live site
      # until a person reads the candidate, writes the note and merges.
      - name: Open review PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'press: new candidates for review'
          branch: press-feed/candidates
          title: 'Press feed: new candidates to review'
          body: |
            The collector found new mentions of Volty U1 or NUEN MOTO.

            For each item in `pending-news.json`:
            1. Open the link and confirm it is a real article, not a scraper repost.
            2. Fix `date` if the feed guessed it wrong.
            3. Write `note_en`, including any correction the article needs.
            4. Write `title_vi` and `note_vi`.
            5. Set `status` to `approved`, or to `rejected` to drop it.

            Then run the Publish workflow, or `node scripts/publish-news.mjs` locally.
          add-paths: |
            pending-news.json

  publish:
    # Separate job, run by hand once the PR above is merged.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Promote approved items
        run: node scripts/publish-news.mjs
      - name: Commit
        run: |
          git config user.name  'volty-bot'
          git config user.email 'bot@voltymoto.com'
          git add news.json pending-news.json
          git diff --staged --quiet || git commit -m 'press: publish approved items'
          git push
